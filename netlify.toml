[build]
  command = "echo 'Use verified static CutProof assets from this isolated branch'"
  publish = "public"

[build.environment]
  NETLIFY_SKIP_NEXTJS_PLUGIN = "true"

[[headers]]
  for = "/cutproof/v13/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
