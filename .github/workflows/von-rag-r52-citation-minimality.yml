name: von-rag R52 citation-minimality regression
on:
  push:
    branches: [amd-r52-citation-minimality-20260930]
    paths:
      - delivery/von-rag-r19/**
      - .github/workflows/von-rag-r52-citation-minimality.yml
permissions:
  contents: read
concurrency:
  group: von-r52-${{ github.ref }}
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12','3.14']
    defaults:
      run:
        working-directory: delivery/von-rag-r19
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-test.txt
      - name: Verify R52 bytes
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected={
            'von_rag/compact.py':'019069cfed15c8ddc6edffc2722cfe2907b094e4ed49734898f092f1a3e11bd8',
            'tests/test_r52_citation_minimality.py':'6b3f8db25d23c70cfd6122bd7df9f166f0167eb9c9ff5f1dc8fb897bcde8ee96',
            'von_rag/conflicts.py':'96fb20864ca07a2132e6cb3c14b2c3ef25eef691e04afebdfa9fdcc9d4d1a75e',
          }
          for p,h in expected.items():
              got=hashlib.sha256(Path(p).read_bytes()).hexdigest()
              assert got==h,(p,h,got)
          print('R52 hashes match local passing candidate')
          PY
      - run: python -m compileall -q von_rag
      - name: Full suite
        run: |
          set -euo pipefail
          mkdir -p evidence/r52
          python -m pytest -q tests -p no:cacheprovider --junitxml=evidence/r52/tests.xml | tee evidence/r52/tests.log
          python - <<'PY'
          import json,os,sys,xml.etree.ElementTree as ET
          from pathlib import Path
          root=ET.parse('evidence/r52/tests.xml').getroot()
          suites=list(root) if root.tag=='testsuites' else [root]
          totals={k:sum(int(s.get(k,0)) for s in suites) for k in ['tests','failures','errors','skipped']}
          assert totals=={'tests':297,'failures':0,'errors':0,'skipped':0},totals
          receipt={'schema':'von-rag-r52-software-1','commit':os.environ['GITHUB_SHA'],'python':sys.version,
                   'tests':totals,'fresh_model_calls':0,'native_amd_validation':False,
                   'submission_changed':False,'scope':'software/scripted-selection controls only'}
          Path('evidence/r52/CI_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: von-rag-r52-software-python-${{ matrix.python }}
          path: delivery/von-rag-r19/evidence/r52/
          retention-days: 14
