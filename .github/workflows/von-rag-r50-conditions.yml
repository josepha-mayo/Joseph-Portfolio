name: von-rag R55 hidden-set hardening
on:
  push:
    branches: [amd-r50-condition-scope-20260930]
    paths:
      - delivery/von-rag-r19/**
      - .github/workflows/von-rag-r50-conditions.yml
permissions:
  contents: read
concurrency:
  group: von-r55-${{ github.ref }}
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    defaults:
      run:
        working-directory: delivery/von-rag-r19
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-test.txt
      - name: Check exact locally tested R55 bytes
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          receipt=json.loads(Path('evidence/r55/LOCAL_RECEIPT.json').read_text())
          for group in ('source_sha256','test_sha256'):
              for name,expected in receipt[group].items():
                  actual=hashlib.sha256(Path(name).read_bytes()).hexdigest()
                  assert actual==expected,(name,expected,actual)
          print('R55 source and control hashes match local passing candidate.')
          PY
      - run: python -m compileall -q von_rag
      - name: Full software suite
        run: |
          set -euo pipefail
          mkdir -p evidence/r55
          python -m pytest -q tests -p no:cacheprovider --junitxml=evidence/r55/ci-tests.xml | tee evidence/r55/ci-tests.log
          python - <<'PY'
          import hashlib,importlib.metadata,json,os,sys,xml.etree.ElementTree as ET
          from pathlib import Path
          suites=ET.parse('evidence/r55/ci-tests.xml').getroot().findall('testsuite')
          totals={k:sum(int(s.get(k,0)) for s in suites) for k in ['tests','failures','errors','skipped']}
          assert totals=={'tests':318,'failures':0,'errors':0,'skipped':0},totals
          out={'schema':'von-rag-r55-ci-software-1','commit':os.environ['GITHUB_SHA'],
               'python':sys.version,'tests':totals,
               'packages':{p:importlib.metadata.version(p) for p in ['pytest','PyMuPDF','python-docx','openpyxl','Pillow']},
               'source_sha256':{str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(Path('von_rag').glob('*.py'))},
               'fresh_model_calls':0,'native_amd_validation':False,'submission_changed':False}
          Path('evidence/r55/CI_RECEIPT.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: von-rag-r55-software-python-${{ matrix.python }}
          path: |
            delivery/von-rag-r19/evidence/r55/
            delivery/von-rag-r19/von_rag/
            delivery/von-rag-r19/tests/test_r5*.py
          retention-days: 14
