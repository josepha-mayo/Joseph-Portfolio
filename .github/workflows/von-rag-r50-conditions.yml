name: von-rag R57 hidden-set hardening
on:
  push:
    branches: [amd-r50-condition-scope-20260930]
    paths:
      - delivery/von-rag-r19/**
      - .github/workflows/von-rag-r50-conditions.yml
permissions:
  contents: read
concurrency:
  group: von-r57-${{ github.ref }}
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    defaults:
      run:
        working-directory: delivery/von-rag-r19
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-test.txt
      - name: Check exact inherited and R57 bytes
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          old=json.loads(Path('evidence/r55/LOCAL_RECEIPT.json').read_text())
          superseded={'von_rag/parsers.py','von_rag/retrieval.py'}
          for group in ('source_sha256','test_sha256'):
              for name,expected in old[group].items():
                  if name in superseded: continue
                  actual=hashlib.sha256(Path(name).read_bytes()).hexdigest()
                  assert actual==expected,(name,expected,actual)
          r56=json.loads(Path('evidence/r56/LOCAL_RECEIPT.json').read_text())
          for name,expected in r56['changed_sha256'].items():
              actual=hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual==expected,(name,expected,actual)
          r57=json.loads(Path('evidence/r57/LOCAL_RECEIPT.json').read_text())
          for name,expected in r57['changed_sha256'].items():
              actual=hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual==expected,(name,expected,actual)
          print('R57 inherited and changed bytes match.')
          PY
      - run: python -m compileall -q von_rag
      - name: Full software suite
        run: |
          set -euo pipefail
          mkdir -p evidence/r57
          python -m pytest -q tests -p no:cacheprovider --junitxml=evidence/r57/ci-tests.xml | tee evidence/r57/ci-tests.log
          python - <<'PY'
          import hashlib,importlib.metadata,json,os,sys,xml.etree.ElementTree as ET
          from pathlib import Path
          suites=ET.parse('evidence/r57/ci-tests.xml').getroot().findall('testsuite')
          totals={k:sum(int(s.get(k,0)) for s in suites) for k in ['tests','failures','errors','skipped']}
          assert totals=={'tests':324,'failures':0,'errors':0,'skipped':0},totals
          out={'schema':'von-rag-r57-ci-software-1','commit':os.environ['GITHUB_SHA'],
               'python':sys.version,'tests':totals,
               'packages':{p:importlib.metadata.version(p) for p in ['pytest','PyMuPDF','python-docx','openpyxl','Pillow']},
               'source_sha256':{str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(Path('von_rag').glob('*.py'))},
               'fresh_model_calls':0,'native_amd_validation':False,'submission_changed':False}
          Path('evidence/r57/CI_RECEIPT.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: von-rag-r57-software-python-${{ matrix.python }}
          path: |
            delivery/von-rag-r19/evidence/r57/
            delivery/von-rag-r19/von_rag/
            delivery/von-rag-r19/tests/test_r5*.py
          retention-days: 14
