name: von-rag R25 value-pointer paired model study
on:
  push:
    branches: [amd-r19-citation-rag-20260928]
    paths: [.github/workflows/von-rag-r25-value-pointer.yml]
permissions:
  contents: read
concurrency:
  group: von-rag-r25-value-study
  cancel-in-progress: false
jobs:
  guard-tests:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    defaults:
      run:
        working-directory: delivery/von-rag-r19
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: delivery/von-rag-r19
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-test.txt
      - run: |
          mkdir -p evidence/r25-tests
          python -m pytest -q tests --junitxml=evidence/r25-tests/results.xml | tee evidence/r25-tests/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: von-rag-r25-guards
          path: delivery/von-rag-r19/evidence/r25-tests/
          retention-days: 14
  paired-model:
    needs: guard-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: delivery/von-rag-r19
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: delivery/von-rag-r19
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install explicit CPU-only diagnostic dependencies
        run: |
          set -euo pipefail
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==5.3.0 accelerate==1.13.0 Pillow==12.3.0
      - name: Evaluate both protocols on six new authored questions
        timeout-minutes: 27
        run: |
          set -euo pipefail
          mkdir -p evidence/r25-value-pointer
          timeout --kill-after=10s 1560s python -u diagnostics/value_probe.py 2>&1 | tee evidence/r25-value-pointer/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: von-rag-r25-paired-model
          path: |
            delivery/von-rag-r19/evidence/r25-value-pointer/*.json
            delivery/von-rag-r19/evidence/r25-value-pointer/*.log
          retention-days: 14
