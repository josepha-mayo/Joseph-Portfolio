name: CutProof Source Lock release
on:
  push:
    branches: [cutproof-sourcelock-20260908]
    paths: [.github/workflows/cutproof-source-lock.yml, LOCK_REBUILD]
permissions:
  contents: write
concurrency:
  group: cutproof-source-lock-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/cutproof-sourcelock-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Assemble byte-pinned base and actual new implementation
        run: |
          python3 upgrade13/build.py
          node --test upgrade13/binding.test.cjs
      - name: Install native and browser verification dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng
          python3 -m venv /tmp/cutproof13
          /tmp/cutproof13/bin/pip -q install playwright==1.55.0
          /tmp/cutproof13/bin/python -m playwright install --with-deps chromium
      - name: Fail fast on real hash and editing workflows
        run: |
          /tmp/cutproof13/bin/python upgrade13/native_check.py
          /tmp/cutproof13/bin/python upgrade13/browser_check.py
      - name: Install stock synthetic narration dependencies
        run: |
          /tmp/cutproof13/bin/pip -q install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          /tmp/cutproof13/bin/pip -q install kokoro==0.9.4 soundfile==0.13.1
      - name: Run all new and inherited tests and record real demonstration
        run: /tmp/cutproof13/bin/python upgrade13/release.py
      - name: Preserve source and executed evidence on isolated branch only
        if: always()
        run: |
          git config user.name 'CutProof Verification'
          git config user.email 'cutproof-build@users.noreply.github.com'
          git add upgrade13 public/cutproof/v13
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Preserve Source Lock source and actual execution evidence'
          git push origin HEAD:cutproof-sourcelock-20260908
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cutproof-source-lock-release
          path: public/cutproof/v13/
          retention-days: 14
