name: von-read required container base
on:
  push:
    branches: [master]
    paths: [.github/workflows/von-read-container-base.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: von-read-container-base
  cancel-in-progress: false
jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE_IMAGE: rocm/pytorch:rocm10.0_ubuntu26.04_py3.14_pytorch_release_2.13.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e39b6e734a549437796fbab8fc0e02638ce72fd4
          persist-credentials: false
      - name: Prepare this disposable builder only
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          mkdir -p receipts
          df -B1 / > receipts/disk-before.txt
          # Only preinstalled SDK caches on this job's disposable GitHub VM.
          # Never executed on the participant's laptop or AMD notebook.
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet
          df -B1 / > receipts/disk-after.txt
          python3 - <<'PY'
          import json,shutil
          from pathlib import Path
          free=shutil.disk_usage('/').free
          Path('receipts/capacity.json').write_text(json.dumps({'free_bytes':free,'required_bytes':45*2**30,'paid_runner':False,'gpu':False},indent=2))
          assert free>=45*2**30, 'Insufficient builder capacity; stop before the large pull'
          PY
      - name: Pull the exact mandated tag without squashing
        run: |
          timeout --kill-after=20s 900s docker pull "$BASE_IMAGE" > receipts/base-pull.log 2>&1
          docker image inspect "$BASE_IMAGE" > receipts/base-inspect.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('receipts/base-inspect.json').read_text())[0]
          result={'id':d['Id'],'repo_digests':d.get('RepoDigests',[]),'base_uncompressed_bytes':d['Size'],'rootfs_layers':d['RootFS']['Layers'],'base_tag':'rocm/pytorch:rocm10.0_ubuntu26.04_py3.14_pytorch_release_2.13.0','architecture':d['Architecture']}
          Path('receipts/BASE.json').write_text(json.dumps(result,indent=2))
          assert d['Architecture']=='amd64'
          assert d['Size']+12*2**30<60*2**30, 'No room for the locked reader within the 60 GiB limit'
          PY
      - name: Build the measured dependency layer
        run: |
          mkdir -p build
          cat > build/requirements.txt <<'TXT'
          transformers==5.3.0
          accelerate==1.13.0
          huggingface_hub==1.32.0
          click==8.5.0
          hf-xet==1.6.0
          httpx==0.28.1
          httpcore==1.0.9
          tokenizers==0.22.2
          filelock==4.0.3
          fsspec==2026.9.0
          h11==0.16.0
          numpy==2.5.3
          PyYAML==6.0.3
          regex==2026.9.10
          safetensors==0.8.0
          networkx==3.7
          sympy==1.14.0
          mpmath==1.3.0
          tqdm==4.70.1
          anyio==4.15.1
          idna==3.20
          typing_extensions==4.16.0
          certifi==2026.7.22
          Jinja2==3.1.6
          MarkupSafe==3.0.3
          psutil==7.2.2
          typer==0.27.2
          annotated-doc==0.0.5
          rich==15.0.0
          Pygments==2.21.0
          markdown-it-py==4.2.0
          mdurl==0.1.2
          shellingham==1.5.4
          TXT
          cat > build/Dockerfile <<'DOCKER'
          FROM rocm/pytorch:rocm10.0_ubuntu26.04_py3.14_pytorch_release_2.13.0
          COPY requirements.txt /app/requirements.txt
          RUN python3 -m pip install --no-cache-dir --no-deps -r /app/requirements.txt
          WORKDIR /app
          DOCKER
          timeout --kill-after=20s 480s docker build --progress plain -t von-read-dependency-check:local build > receipts/dependency-build.log 2>&1
          docker image inspect von-read-dependency-check:local > receipts/dependency-inspect.json
      - name: Exercise the built environment without substituting CPU OCR
        run: |
          cat > receipts/check_environment.py <<'PY'
          import importlib.metadata as m,json,sys
          from pathlib import Path
          import torch,transformers
          from transformers import Qwen3VLForConditionalGeneration,AutoProcessor
          from PIL import Image
          assert sys.version_info[:2]==(3,14)
          assert torch.__version__=='2.13.0+rocm10.0.0'
          assert torch.version.hip
          assert transformers.__version__=='5.3.0'
          print(json.dumps({'python':sys.version.split()[0],'torch':torch.__version__,'hip':torch.version.hip,'transformers':transformers.__version__,'Pillow':m.version('Pillow'),'Qwen_import':True,'gpu_attached':torch.cuda.is_available(),'scope':'Real Docker dependency/import check, no neural inference or final image certification'}))
          PY
          timeout --kill-after=5s 60s docker run --rm --network none --entrypoint python3 -v "$PWD/receipts/check_environment.py:/check.py:ro" von-read-dependency-check:local /check.py > receipts/ENVIRONMENT.json 2> receipts/import-errors.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path('receipts/base-inspect.json').read_text())[0]
          c=json.loads(Path('receipts/dependency-inspect.json').read_text())[0]
          prefix=c['RootFS']['Layers'][:len(b['RootFS']['Layers'])]==b['RootFS']['Layers']
          assert prefix
          Path('receipts/LAYERS.json').write_text(json.dumps({'mandated_base_prefix_matches':prefix,'dependency_image_bytes':c['Size'],'model_weights_present':False,'published_to_registry':False,'final_container':False},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: von-read-container-base-receipts
          path: receipts/
          retention-days: 7
          if-no-files-found: error
