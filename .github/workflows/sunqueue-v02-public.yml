name: SunQueue replay public verification
on:
  push:
    branches: [sunqueue-entry-preview-20260907]
    paths: [public/sunqueue/V02_PUBLIC_URL]
permissions:
  contents: write
concurrency:
  group: sunqueue-v02-public
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/sunqueue-entry-preview-20260907'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sunqueue-entry-preview-20260907
      - name: Install browser and media verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 -m venv /tmp/sunqueue-public-v02
          /tmp/sunqueue-public-v02/bin/pip -q install playwright==1.55.0
          /tmp/sunqueue-public-v02/bin/python -m playwright install chromium
      - name: Verify anonymous files and actual public app behavior
        run: /tmp/sunqueue-public-v02/bin/python public/sunqueue/upgrade02/public_check.py
      - name: Preserve actual public test results
        if: always()
        run: |
          git config user.name 'SunQueue Build'
          git config user.email 'sunqueue-build@users.noreply.github.com'
          git add public/sunqueue/v02/evidence public/sunqueue/v02/tests
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record SunQueue replay public-origin test results'
          git pull --rebase origin sunqueue-entry-preview-20260907
          git push origin HEAD:sunqueue-entry-preview-20260907
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sunqueue-v02-public-evidence
          path: public/sunqueue/v02/evidence/
          retention-days: 14
