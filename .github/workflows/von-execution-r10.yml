name: von bounded execution R10
on:
  push:
    branches: [von-execution-r10-20260927]
    paths:
      - delivery/von-notebook-execution/**
      - .github/workflows/von-execution-r10.yml
permissions:
  contents: read
concurrency:
  group: von-execution-r10-20260927
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test dependency
        run: python -m pip install pytest==9.1.1
      - name: Verify journals, acceptance semantics, and payload bounds
        working-directory: delivery/von-notebook-execution
        run: python -m pytest -q -p no:cacheprovider test_amd_cycle.py test_execution_fixes.py

