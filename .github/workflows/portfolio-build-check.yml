name: portfolio production build check
on:
  push:
    branches: [site-build-debug-20261003]
    paths:
      - .github/workflows/portfolio-build-check.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Reproduce production build
        run: npm run build
