name: Forkline Delivery Lab portable release
on:
  push:
    branches: [forkline-outbox-20260908]
    paths: [.github/workflows/forkline-portable-release.yml, DELIVERY_REBUILD]
permissions:
  contents: write
concurrency:
  group: forkline-outbox-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/forkline-outbox-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Validate only the optional macOS watcher metadata
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          p=Path('package-lock.json');raw=p.read_bytes();lock=json.loads(raw)
          key='node_modules/ganache/node_modules/fsevents';entry=lock['packages'][key]
          assert entry['version']=='2.3.2' and entry.get('os')==['darwin']
          assert entry['resolved']=='https://registry.npmjs.org/fsevents/-/fsevents-2.3.2.tgz'
          owners={name:item['optionalDependencies']['fsevents'] for name,item in lock['packages'].items() if 'fsevents' in item.get('optionalDependencies',{})}
          assert owners,'Cannot establish fsevents as an optional dependency in the locked graph'
          before=json.loads(json.dumps(entry));entry['optional']=True
          p.write_text(json.dumps(lock,indent=2)+'\n')
          Path('evidence/portable-lock-fix.json').write_text(json.dumps({'scope':'Only macOS-only optional watcher metadata; versions, resolved URLs and integrity hashes unchanged','entry':key,'before':before,'after':entry,'optional_dependency_owners':owners,'before_sha256':hashlib.sha256(raw).hexdigest(),'after_sha256':hashlib.sha256(p.read_bytes()).hexdigest()},indent=2))
          PY
      - name: Install pinned runtime and exercise real database and browser paths first
        run: |
          set -o pipefail
          npm ci --ignore-scripts --no-audit --no-fund 2>&1 | tee evidence/portable-install.log
          python3 -m venv /tmp/forkline-outbox-venv
          /tmp/forkline-outbox-venv/bin/pip -q install playwright==1.55.0 python-pptx==1.0.2
          /tmp/forkline-outbox-venv/bin/python -m playwright install --with-deps chromium
          export PATH=/tmp/forkline-outbox-venv/bin:$PATH
          npm run build
          npm run evm
          npm test 2>&1 | tee evidence/portable-unit-preflight.log
          npm run outbox:record
          python tests/sqlite_oracle.py
          python -m http.server 8080 --bind 127.0.0.1 --directory public >/tmp/forkline-preflight-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          sleep 1
          python tests/browser.py
          python tests/delivery_browser.py
      - name: Install CPU-only stock narration and media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends espeak-ng ffmpeg libreoffice-impress poppler-utils
          /tmp/forkline-outbox-venv/bin/pip -q install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          /tmp/forkline-outbox-venv/bin/pip -q install kokoro==0.9.4 soundfile==0.13.1
      - name: Execute and record the actual integration release
        run: |
          set -o pipefail
          export PATH=/tmp/forkline-outbox-venv/bin:$PATH
          python tools/delivery-release.py 2>&1 | tee evidence/portable-release.log
      - name: Preserve source and actual results only on this isolated branch
        if: always()
        run: |
          git config user.name 'Forkline Delivery Lab Verification'
          git config user.email 'forkline-build@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Preserve portable Delivery Lab source and actual release results'
          git push origin HEAD:forkline-outbox-20260908
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forkline-portable-release
          path: |
            public/
            evidence/
            src/
            tools/
            tests/
            contracts/
            package.json
            package-lock.json
            README.md
            docs-delivery.md
            netlify.toml
          retention-days: 14
