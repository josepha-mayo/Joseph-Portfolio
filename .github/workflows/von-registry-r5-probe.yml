name: von-read bounded registry transport probe
on:
  push:
    branches: [von-registry-r5-20260925]
    paths: [.github/workflows/von-registry-r5-probe.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: von-registry-r5-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: delivery/registry-r5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::046675437218:role/von-registry-r5-publisher-20260925
          role-session-name: von-registry-small-probe
          role-duration-seconds: 900
          mask-aws-account-id: true
          unset-current-credentials: true
      - name: Install test-client dependencies in the disposable runner
        run: |
          python3 -m venv /tmp/von-registry-probe-env
          /tmp/von-registry-probe-env/bin/pip -q install boto3 requests
      - name: Wait for this experiment stack only
        run: aws cloudformation wait stack-create-complete --stack-name von-registry-r5b-20260925
      - name: Publish tiny fixture and test actual anonymous Docker pull
        run: |
          /tmp/von-registry-probe-env/bin/python - <<'PY'
          import importlib.util,json,sys
          from pathlib import Path
          path=Path('delivery/registry-r5/probe.py')
          spec=importlib.util.spec_from_file_location('transport_probe',path)
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          # Only the stack identifier changed following a CFN schema correction.
          module.STACK='von-registry-r5b-20260925'
          try:
              module.main()
          except Exception as error:
              print(json.dumps({'status':'failed','error_type':type(error).__name__,'message':str(error) if isinstance(error,AssertionError) else 'Private request details suppressed'}))
              sys.exit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: von-registry-small-probe-receipt
          path: /tmp/von-registry-receipt/
          retention-days: 7
          if-no-files-found: warn
