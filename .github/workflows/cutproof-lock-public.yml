name: CutProof Source Lock public verification
on:
  push:
    branches: [cutproof-sourcelock-20260908]
    paths: [LOCK_PUBLIC_URL]
permissions:
  contents: write
concurrency:
  group: cutproof-lock-public
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/cutproof-sourcelock-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install actual browser and media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 -m venv /tmp/cutproof-public
          /tmp/cutproof-public/bin/pip -q install playwright==1.55.0
          /tmp/cutproof-public/bin/python -m playwright install --with-deps chromium
      - name: Verify anonymous release and actual model and handoff behavior
        run: /tmp/cutproof-public/bin/python upgrade13/public_check.py
      - name: Preserve actual public results on isolated branch only
        if: always()
        run: |
          git config user.name 'CutProof Verification'
          git config user.email 'cutproof-build@users.noreply.github.com'
          git add public/cutproof/v13/evidence upgrade13
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record actual CutProof Source Lock public-origin checks'
          git push origin HEAD:cutproof-sourcelock-20260908
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cutproof-source-lock-public
          path: public/cutproof/v13/evidence/
          retention-days: 14
