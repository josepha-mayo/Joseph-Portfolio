name: von-rag R47 hidden-shaped regression
on:
  push:
    branches: [amd-r19-citation-rag-20260928]
    paths:
      - delivery/von-rag-r19/von_rag/parsers.py
      - delivery/von-rag-r19/von_rag/compact.py
      - delivery/von-rag-r19/tests/test_r47_hidden_shaped.py
      - .github/workflows/von-rag-r47-hidden-shaped.yml
permissions:
  contents: read
concurrency:
  group: von-rag-r47-hidden-shaped
  cancel-in-progress: false
jobs:
  verify:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: delivery/von-rag-r19
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: delivery/von-rag-r19
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-test.txt
      - name: Complete software suite
        run: |
          set -euo pipefail
          mkdir -p evidence/r47
          python -m pytest -q tests --junitxml=evidence/r47/tests.xml | tee evidence/r47/tests.log
          python - <<'PY'
          import json, hashlib, xml.etree.ElementTree as ET
          from pathlib import Path
          root=ET.parse('evidence/r47/tests.xml').getroot()
          suites=list(root) if root.tag=='testsuites' else [root]
          totals={k:sum(int(s.get(k,0)) for s in suites) for k in ['tests','failures','errors','skipped']}
          assert totals['failures']==totals['errors']==0
          result={'schema':'von-rag-r47-software-1','status':'passed','tests':totals,
                  'source_sha256':{str(p):hashlib.sha256(p.read_bytes()).hexdigest()
                                   for p in [Path('von_rag/parsers.py'),Path('von_rag/compact.py')]},
                  'native_gpu_validation':False,'submission_changed':False}
          Path('evidence/r47/RECEIPT.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: von-rag-r47-software
          path: delivery/von-rag-r19/evidence/r47/
          retention-days: 14
