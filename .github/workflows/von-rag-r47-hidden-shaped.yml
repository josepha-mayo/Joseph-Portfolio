name: von-rag R48 grounded conflict regression
on:
  push:
    branches: [amd-r19-citation-rag-20260928]
    paths:
      - delivery/von-rag-r19/von_rag/parsers.py
      - delivery/von-rag-r19/von_rag/compact.py
      - delivery/von-rag-r19/von_rag/conflicts.py
      - delivery/von-rag-r19/tests/test_r47_hidden_shaped.py
      - delivery/von-rag-r19/tests/test_r48_conflict_controls.py
      - .github/workflows/von-rag-r47-hidden-shaped.yml
permissions:
  contents: read
concurrency:
  group: von-rag-r47-hidden-shaped
  cancel-in-progress: false
jobs:
  verify:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: delivery/von-rag-r19
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: delivery/von-rag-r19
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-test.txt
      - name: Compile before running any tests
        run: python -m compileall -q von_rag
      - name: Complete software suite
        run: |
          set -euo pipefail
          mkdir -p evidence/r48
          python -m pytest -q tests --junitxml=evidence/r48/tests.xml | tee evidence/r48/tests.log
          python - <<'PY'
          import json, hashlib, xml.etree.ElementTree as ET
          from pathlib import Path
          root=ET.parse('evidence/r48/tests.xml').getroot()
          suites=list(root) if root.tag=='testsuites' else [root]
          totals={k:sum(int(s.get(k,0)) for s in suites) for k in ['tests','failures','errors','skipped']}
          assert totals['failures']==totals['errors']==0
          result={'schema':'von-rag-r48-software-1','status':'passed','tests':totals,
                  'source_sha256':{str(p):hashlib.sha256(p.read_bytes()).hexdigest()
                                   for p in sorted(Path('von_rag').glob('*.py'))},
                  'scope':'software and scripted-output controls, not fresh model inference',
                  'native_gpu_validation':False,'submission_changed':False}
          Path('evidence/r48/RECEIPT.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          PY
      - name: Retain exact source for independent reproduction
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile,hashlib,json
          out=Path('evidence/r48');out.mkdir(parents=True,exist_ok=True)
          files=[]
          with zipfile.ZipFile(out/'tested-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for directory in ('von_rag','tests','diagnostics'):
                  for p in sorted(Path(directory).glob('*.py')):
                      z.write(p,p.as_posix());files.append({'path':p.as_posix(),'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
              for name in ('requirements-test.txt','LICENSE.txt'):z.write(name,name)
          (out/'SOURCE_FILES.json').write_text(json.dumps(files,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: von-rag-r48-software
          path: delivery/von-rag-r19/evidence/r48/
          retention-days: 14
