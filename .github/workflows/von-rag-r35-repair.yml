name: von-rag R35 integrated repair validation
on:
  push:
    branches: [amd-r19-citation-rag-20260928]
    paths:
      - delivery/von-rag-r19/von_rag/compact.py
      - delivery/von-rag-r19/von_rag/selection_repair.py
      - delivery/von-rag-r19/tests/test_grounded_selection_repair.py
      - .github/workflows/von-rag-r35-repair.yml
permissions:
  contents: read
concurrency:
  group: von-rag-r35-repair
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: delivery/von-rag-r19
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: delivery/von-rag-r19
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-test.txt
      - name: Run complete CPU contract suite
        run: |
          set -euo pipefail
          mkdir -p evidence/r35
          python -m pytest -q tests --junitxml=evidence/r35/tests.xml | tee evidence/r35/tests.log
          python - <<'PY'
          import ast,hashlib,json,xml.etree.ElementTree as ET
          from pathlib import Path
          root=ET.parse('evidence/r35/tests.xml').getroot()
          suites=list(root) if root.tag=='testsuites' else [root]
          totals={k:sum(int(s.get(k,0)) for s in suites) for k in ['tests','failures','errors','skipped']}
          assert totals['failures']==totals['errors']==0
          paths=['von_rag/compact.py','von_rag/retrieval.py','von_rag/runtime.py','von_rag/selection_repair.py']
          receipt={'schema':'von-rag-r35-integrated-repair-1','status':'passed','tests':totals,
            'scope':'CPU parsing/retrieval/grounding/runtime contracts; no neural or AMD score',
            'sources':{p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}}
          Path('evidence/r35/RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: von-rag-r35-integrated-repair-tests
          path: delivery/von-rag-r19/evidence/r35/
          retention-days: 14
