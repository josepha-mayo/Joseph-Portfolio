name: Countback public photo acquisition
on:
  push:
    branches: [eval/countback-photos-20260913]
    paths: ['.github/workflows/countback-photo-acquisition.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: countback-photo-acquisition-${{ github.ref }}
  cancel-in-progress: false
jobs:
  acquire:
    if: github.ref == 'refs/heads/eval/countback-photos-20260913'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect bounded ZIP index and release documentation
        run: python3 countback-evaluation/photo_acquisition.py photo-acquisition-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: countback-photo-acquisition
          path: photo-acquisition-evidence/
          retention-days: 14
          if-no-files-found: error
