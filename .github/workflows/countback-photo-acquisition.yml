name: Countback public photo acquisition
on:
  push:
    branches: [eval/countback-photos-20260913]
    paths: ['.github/workflows/countback-photo-acquisition.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: countback-photo-acquisition-${{ github.ref }}
  cancel-in-progress: false
jobs:
  acquire:
    if: github.ref == 'refs/heads/eval/countback-photos-20260913'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Acquire fixed RGB subset without model inference
        run: python3 countback-evaluation/photo_subset.py photo-subset-evidence
      - name: Retain exact evaluator and acquisition sources
        if: always()
        run: |
          mkdir -p photo-subset-evidence/tooling
          cp countback-evaluation/{evaluate.py,test_evaluate.py,smoke.py,photo_acquisition.py,photo_subset.py,LICENSE,README.md} photo-subset-evidence/tooling/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: countback-uwis-photo-subset
          path: photo-subset-evidence/
          retention-days: 14
          if-no-files-found: error
