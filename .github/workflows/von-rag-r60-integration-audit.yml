name: von-rag R60 independent integration audit
on:
  push:
    branches: [amd-r60-integration-audit-20261001]
    paths: [.github/workflows/von-rag-r60-integration-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r delivery/von-rag-r19/requirements-test.txt
      - name: Preserve both pinned source trees and cross-branch controls
        run: |
          git fetch --no-tags origin 820bb8e15016c57de677c287b5c6ae06e1a08baf
          python - <<'PY'
          import hashlib,json,subprocess,zipfile
          from pathlib import Path
          out=Path('r60-evidence');out.mkdir()
          prefix='delivery/von-rag-r19/'
          sources={'r59':'7c4ed9da292f45962333be127a5887a8470a43ff','donor':'820bb8e15016c57de677c287b5c6ae06e1a08baf'}
          manifests={}
          for label,ref in sources.items():
              tree=subprocess.check_output(['git','ls-tree','-r','--name-only',ref,'--',prefix],text=True).splitlines()
              manifest={}
              with zipfile.ZipFile(out/(label+'-source.zip'),'w',zipfile.ZIP_DEFLATED) as z:
                  for path in tree:
                      rel=path[len(prefix):]
                      allowed=(rel.startswith(('von_rag/','tests/','diagnostics/')) and rel.endswith('.py')) or rel in ('requirements-test.txt','LICENSE.txt','app.py')
                      if not allowed:continue
                      data=subprocess.check_output(['git','show',ref+':'+path])
                      assert len(data)<1000000,path
                      z.writestr(rel,data);manifest[rel]=hashlib.sha256(data).hexdigest()
              manifests[label]={'commit':ref,'files':manifest}
          (out/'SOURCE_MANIFESTS.json').write_text(json.dumps(manifests,indent=2)+'\n')
          Path('r60-cross').mkdir()
          for name in ['test_r55_python_authority.py','test_r56_docx_merges.py','test_r57_file_budget.py','test_r58_scorer_aliases.py']:
              data=subprocess.check_output(['git','show',sources['donor']+':'+prefix+'tests/'+name])
              Path('r60-cross',name).write_bytes(data)
          PY
      - name: Run unchanged R59 baseline
        working-directory: delivery/von-rag-r19
        run: |
          python -m pytest -q tests -p no:cacheprovider --junitxml=../../../r60-evidence/r59-baseline.xml > ../../../r60-evidence/r59-baseline.log 2>&1
      - name: Test donor controls on exact unchanged R59
        working-directory: delivery/von-rag-r19
        run: |
          python - <<'PY'
          import os,json,subprocess,sys,xml.etree.ElementTree as ET
          from pathlib import Path
          out=Path('../../../r60-evidence').resolve()
          env=dict(os.environ,PYTHONPATH=str(Path.cwd()))
          with (out/'cross-branch.log').open('w') as log:
              result=subprocess.run([sys.executable,'-m','pytest','-q','../../../r60-cross','-p','no:cacheprovider','--junitxml='+str(out/'cross-branch.xml')],stdout=log,stderr=subprocess.STDOUT,env=env,timeout=300)
          suites=ET.parse(out/'cross-branch.xml').getroot().findall('testsuite')
          totals={k:sum(int(s.get(k,0)) for s in suites) for k in ['tests','failures','errors','skipped']}
          receipt={'schema':'von-r60-cross-branch-audit-1','unchanged_runtime':'7c4ed9da292f45962333be127a5887a8470a43ff','donor_controls':'820bb8e15016c57de677c287b5c6ae06e1a08baf','exit_code':result.returncode,'tests':totals,'runtime_modified':False,'fresh_model_calls':0,'submission_changed':False}
          (out/'CROSS_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          print((out/'cross-branch.log').read_text()[-18000:])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: von-rag-r60-integration-audit
          path: r60-evidence/
          retention-days: 14
