name: von-rag V3 preview registry gate
on:
  push:
    branches: [amd-v3-preview-registry-20261003]
    paths:
      - src/app/v2/**
      - src/generated/von-registry-v3.json
      - public/registry-assets/v3/**
      - tests/von-registry-v3.test.mjs
      - netlify.toml
      - .github/workflows/von-rag-v3-preview-gate.yml
permissions:
  contents: read
concurrency:
  group: von-rag-v3-preview-gate
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact V3 static assets and receipt
        run: |
          set -euo pipefail
          echo "2cd44cd0a63ecf1edd61a3aaf0329fd8df22f802eaaa3b5b090d3ff82dc5759d  public/registry-assets/v3/manifest.json" | sha256sum -c -
          echo "180056296b31d73e2e725cb376bb5d9601561befd651e8d2a0c554c5d486f37b  public/registry-assets/v3/config.json" | sha256sum -c -
          echo "455615bc3a018340753f08051ed82fc1b943a62529adb44b9bf2161fc0c503ef  public/registry-assets/v3/455615bc3a018340753f08051ed82fc1b943a62529adb44b9bf2161fc0c503ef.tar.gz" | sha256sum -c -
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('public/registry-assets/v3/BUILD_RECEIPT.json').read_text())
          assert r['source_artifact_run']==37040477578
          assert r['source_artifact_id']==11241826822
          assert r['source_head_sha']=='2eecf0b809c75078af1fb935ecfe07e9d60116da'
          assert r['parent_manifest']=='sha256:0205651ae7d2806d3286a22270b5d7e23f1ec3f8ac47ed7352a719feca2e6b07'
          assert r['parent_config']=='sha256:3649af2042930c40db6ed42f9d4711f96e3ec73be5157d8846416ed5ab18a90c'
          assert r['candidate_manifest']=='sha256:2cd44cd0a63ecf1edd61a3aaf0329fd8df22f802eaaa3b5b090d3ff82dc5759d'
          assert r['candidate_config']=='sha256:180056296b31d73e2e725cb376bb5d9601561befd651e8d2a0c554c5d486f37b'
          assert r['parent_layers']==28 and r['candidate_layers']==29
          assert r['overlay_bytes']==36759
          assert not r['weights_changed'] and not r['submission_changed']
          assert r['full_container_amd_qualified'] is False and r['promotion_allowed'] is False
          print(json.dumps(r,indent=2))
          PY

      - name: Run isolated V3 registry tests
        run: node --experimental-strip-types --test tests/von-registry-v3.test.mjs

      - name: Verify route and immutable-header wiring
        run: |
          set -euo pipefail
          grep -F "import v3 from '@/generated/von-registry-v3.json'" src/app/v2/'[[...registry]]'/route.ts
          grep -F "path.startsWith('/v2/von-rag-v3/')" src/app/v2/'[[...registry]]'/route.ts
          grep -F 'sha256:2cd44cd0a63ecf1edd61a3aaf0329fd8df22f802eaaa3b5b090d3ff82dc5759d' netlify.toml
          grep -F 'sha256:180056296b31d73e2e725cb376bb5d9601561befd651e8d2a0c554c5d486f37b' netlify.toml
          grep -F 'sha256:455615bc3a018340753f08051ed82fc1b943a62529adb44b9bf2161fc0c503ef' netlify.toml
          echo "V3 source/registry gate passed. Full Next build is delegated to the Netlify deploy preview because the legacy R24 prebuild currently receives an unrelated upstream HTTP 403 on GitHub runners."
