name: von-rag R59 merged hidden-corpus regression
on:
  push:
    branches: [amd-r59-merged-hardening-20260930]
    paths:
      - delivery/von-rag-r19/**
      - .github/workflows/von-rag-r59-merged-hardening.yml
permissions:
  contents: read
concurrency:
  group: von-r59-${{ github.ref }}
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    defaults:
      run:
        working-directory: delivery/von-rag-r19
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-test.txt
      - name: Verify exact merged candidate bytes
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected={
            'von_rag/parsers.py':'e890f40bcba07493c1f53ec90585d096312f75bff1fa1f862e3f2be30e4cfb4a',
            'von_rag/retrieval.py':'0419b3a275c00ab5a8b2b202ba41892beffa16903b1e4d95e30311295f3d4444',
            'tests/test_r51_mixed_status.py':'6cd4048899eccdfa1504aa4d3db23221b4d1bbc038cc59ff8caba02107ad4018',
            'tests/test_r52_pdf_vision.py':'72d9f1fe67bc9c8e6073e7fa29cad0a998ba2941a232ef1bd50dd0f4120e241e',
            'tests/test_r53_encoding_revision.py':'6c68cc39533570ba1b75ee789e3292d3c7f6f0ce6b7314e022c36676493c89ab',
            'tests/test_r59_revision_live_eligibility.py':'9159472500bc794e1219a64847ed5cccd5a8cd6670c3366657835943bc465d69',
          }
          for name,digest in expected.items():
              actual=hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual==digest,(name,digest,actual)
          print('R59 exact hashes verified')
          PY
      - run: python -m compileall -q von_rag
      - name: Full cumulative suite
        run: |
          set -euo pipefail
          mkdir -p evidence/r59
          python -m pytest -q tests -p no:cacheprovider --junitxml=evidence/r59/ci-tests.xml | tee evidence/r59/ci-tests.log
          python - <<'PY'
          import hashlib,importlib.metadata,json,os,sys,xml.etree.ElementTree as ET
          from pathlib import Path
          root=ET.parse('evidence/r59/ci-tests.xml').getroot()
          suites=root.findall('testsuite')
          totals={k:sum(int(s.get(k,0)) for s in suites) for k in ['tests','failures','errors','skipped']}
          assert totals=={'tests':360,'failures':0,'errors':0,'skipped':0},totals
          out={'schema':'von-rag-r59-ci-1','commit':os.environ['GITHUB_SHA'],
               'python':sys.version,'tests':totals,
               'packages':{p:importlib.metadata.version(p) for p in ['pytest','PyMuPDF','python-docx','openpyxl','Pillow']},
               'source_sha256':{str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(Path('von_rag').glob('*.py'))},
               'fresh_model_calls':0,'native_amd_validation':False,'submission_changed':False}
          Path('evidence/r59/CI_RECEIPT.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: von-rag-r59-python-${{ matrix.python }}
          path: delivery/von-rag-r19/evidence/r59/
          retention-days: 14