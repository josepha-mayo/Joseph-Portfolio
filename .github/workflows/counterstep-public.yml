name: Counterstep anonymous public verification
on:
  push:
    branches: [counterstep-entry-preview-20260907]
    paths: [public/counterstep/PUBLIC_URL]
permissions:
  contents: write
concurrency:
  group: counterstep-public-check
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/counterstep-entry-preview-20260907'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: counterstep-entry-preview-20260907
      - name: Install browser and media decoding tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 -m venv /tmp/counterstep-public
          /tmp/counterstep-public/bin/pip -q install playwright==1.55.0
          /tmp/counterstep-public/bin/python -m playwright install --with-deps chromium
      - name: Verify anonymous deployment bytes and actual browser interactions
        working-directory: public/counterstep
        run: /tmp/counterstep-public/bin/python tools/public_check.py
      - name: Preserve actual verification evidence only
        if: always()
        run: |
          git config user.name 'Counterstep Verification'
          git config user.email 'counterstep-verification@users.noreply.github.com'
          git add public/counterstep/evidence
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Preserve actual Counterstep anonymous public check results'
          git pull --rebase origin counterstep-entry-preview-20260907
          git push origin HEAD:counterstep-entry-preview-20260907
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counterstep-public-evidence
          path: public/counterstep/evidence/
          retention-days: 14
