name: von-read source completion gates
on:
  push:
    branches: [master]
    paths:
      - 'public/research/von-read/source/**'
      - '.github/workflows/von-read-source-gates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependency only
        run: python -m pip install pytest==9.0.2
      - name: Test public components, not GPU inference
        working-directory: public/research/von-read/source
        run: python -m pytest -q tests --junitxml=source-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: von-read-source-test-receipt
          path: public/research/von-read/source/source-tests.xml
          retention-days: 14
