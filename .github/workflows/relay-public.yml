name: Counterstep Relay public verification
on:
  push:
    branches: [counterstep-relay-20260907]
    paths: [PUBLIC_URL]
permissions:
  contents: write
concurrency:
  group: counterstep-relay-public
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/counterstep-relay-20260907'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: counterstep-relay-20260907
      - name: Install browser and media verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 -m venv /tmp/relay-public
          /tmp/relay-public/bin/pip -q install playwright==1.55.0
          /tmp/relay-public/bin/python -m playwright install --with-deps chromium
      - name: Verify anonymous files, HTTP tools and actual handoff workflows
        run: |
          export PATH=/tmp/relay-public/bin:$PATH
          python tools/public_check.py
      - name: Preserve actual public results on the isolated branch
        if: always()
        run: |
          git config user.name 'Counterstep Relay Verification'
          git config user.email 'counterstep-relay-verification@users.noreply.github.com'
          git add evidence/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record actual Counterstep Relay public-origin checks'
          git pull --rebase origin counterstep-relay-20260907
          git push origin HEAD:counterstep-relay-20260907
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counterstep-relay-public-evidence
          path: evidence/
          retention-days: 14
