name: von-rag V3 immutable preview full pull
on:
  push:
    branches: [amd-v3-preview-registry-20261003]
    paths: [.github/workflows/von-rag-v3-preview-full-pull.yml]
permissions:
  contents: read
concurrency:
  group: von-v3-preview-full-pull
  cancel-in-progress: false
jobs:
  pull:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      IMAGE: 6ac0fece59ccf10008ae393f--josephm.netlify.app/von-rag-v3@sha256:2cd44cd0a63ecf1edd61a3aaf0329fd8df22f802eaaa3b5b090d3ff82dc5759d
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reclaim runner disk
        run: sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet

      - name: Fresh anonymous pull from immutable V3 preview
        run: |
          set -euo pipefail
          mkdir -p receipts
          export DOCKER_CONFIG="$RUNNER_TEMP/empty-docker"
          mkdir -p "$DOCKER_CONFIG"; printf '{}\n' > "$DOCKER_CONFIG/config.json"
          date -u +%s > receipts/start.txt
          timeout --kill-after=15s 1500s docker pull "$IMAGE" 2>&1 | tee receipts/pull.log
          date -u +%s > receipts/end.txt
          docker image inspect "$IMAGE" > receipts/inspect.json

      - name: Verify image identity, layer graph and size
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          image=json.loads(Path('receipts/inspect.json').read_text())[0]
          assert image['Id']=='sha256:180056296b31d73e2e725cb376bb5d9601561befd651e8d2a0c554c5d486f37b',image['Id']
          layers=image['RootFS']['Layers']
          assert len(layers)==29,len(layers)
          assert layers[-1]=='sha256:a8f6036d2b4ee17693b1844a8f12dcfc7957db0780af686a0c3fd937bcfdc23b',layers[-1]
          assert image['Size'] < 60*1024**3,image['Size']
          assert image['Config']['Entrypoint']==['python3','-m','von_rag.runtime','serve'],image['Config']['Entrypoint']
          seconds=int(Path('receipts/end.txt').read_text())-int(Path('receipts/start.txt').read_text())
          out={'schema':'von-v3-immutable-full-pull-1','status':'transport_passed',
               'manifest':'sha256:2cd44cd0a63ecf1edd61a3aaf0329fd8df22f802eaaa3b5b090d3ff82dc5759d',
               'config':image['Id'],'layers':len(layers),'last_diffid':layers[-1],
               'uncompressed_bytes':image['Size'],'pull_seconds':seconds,
               'anonymous':True,'weights_changed':False,
               'fresh_model_calls':0,'submission_changed':False,
               'full_container_amd_qualified':False,'promotion_allowed':False}
          Path('receipts/transport.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - name: Verify exact V3 runtime bytes inside pulled image
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python3 "$IMAGE" -c '
          from pathlib import Path
          import hashlib,json
          expected={
            "app.py":"32ec6ac66b5c1f5abed3ff8819ee2651f0bb0efa122ca2f8f760e111c3357054",
            "von_rag/__init__.py":"6ccfe2f5d8df626043e2bf41e0d425cb50c25417b057f6fd03c159874737a79c",
            "von_rag/compact.py":"931c5dcf5cd2015173416248d32aba7eac8cb350378b10dc7097445eff8093de",
            "von_rag/conflicts.py":"386b6661a6ecd78e69a4e4384c40ae7a54db51bb821dcda0d88c0170c398e179",
            "von_rag/engine.py":"08d0a430ce1954c65cb9ea6bcc8b36445cdca560baabbb60afe0717d48aee619",
            "von_rag/native.py":"bc17e89fdfcedf5299626e34ae4d64101ba083edef29e6996a2ef4bed3a7c539",
            "von_rag/parsers.py":"f6d15c325f2e63edaeb6fb4d4b3a824987b5ad24046df45c31b04a4842344f95",
            "von_rag/proofs.py":"dae359f5be88c018383863cd9e5812d1ffc0d270c728d4b664654bc604c316bf",
            "von_rag/retrieval.py":"4fa43d3a7c7ed32c80f62e2109580a103b04404b5bfcc88b1a23617a418ffda6",
            "von_rag/runtime.py":"b4e47f02f3946a1741212fed9c8d4ef67c9a60670bfe9752c4c4f6dbdac76a59",
            "von_rag/scalar_guard.py":"ba54b42303b034ff3144e7b19e8c91bdff807d7c5cf9ac1db8f0f636312539d7",
            "von_rag/scope_links.py":"09fd7934030b29399001567fd5c3cc41a23818a38b5fe8800afaf1f8c544c35b",
            "von_rag/selection_repair.py":"9a4c85662c56cca132342cc7adbe9b894285865384b74d393fd0196c77a0e979",
            "von_rag/value_pointer.py":"e459c5620ee3d77d4df12cc43bfdfa1f55c66c7a9d6fbb060c1d0dbb94561894"}
          for rel,want in expected.items():
              got=hashlib.sha256((Path("/app")/rel).read_bytes()).hexdigest()
              assert got==want,(rel,got,want)
          print(json.dumps({"status":"passed","runtime_files":len(expected)}))
          ' | tee receipts/source-check.log

      - name: Exercise diagnostic process/socket lifecycle without GPU
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh "$IMAGE" -lc '
            set -eu
            export VON_RAG_SOCKET=/tmp/von-v3.sock
            export VON_RAG_INDEX=/tmp/von-v3.sqlite
            export VON_RAG_OUTPUT=/tmp/out
            export VON_RAG_AUDIT=/tmp/audit
            python3 -m von_rag.runtime serve --diagnostic >/tmp/server.log 2>&1 &
            p=$!
            trap "kill $p 2>/dev/null || true" EXIT
            i=0
            while [ ! -S "$VON_RAG_SOCKET" ]; do
              i=$((i+1)); [ "$i" -lt 100 ] || { cat /tmp/server.log; exit 1; }
              sleep 0.1
            done
            python3 -m von_rag.runtime health | tee /tmp/health.json
            grep -F '"'"'cpu_diagnostic'"'"' /tmp/health.json
            kill "$p"; wait "$p" || true
            trap - EXIT
          ' | tee receipts/diagnostic-lifecycle.log

      - name: Final receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('receipts/transport.json').read_text())
          x.update(source_hashes_verified=True,diagnostic_lifecycle_passed=True,
                   scope='anonymous transport + CPU diagnostic lifecycle; not AMD GPU inference')
          Path('receipts/RESULT.json').write_text(json.dumps(x,indent=2)+'\n')
          print(json.dumps(x,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: von-rag-v3-immutable-preview-full-pull
          path: receipts/
          retention-days: 14
