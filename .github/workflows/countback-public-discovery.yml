name: Countback public dataset discovery
on:
  push:
    branches: [eval/countback-uwis-discovery]
    paths: [.github/workflows/countback-public-discovery.yml]
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Retrieve publisher metadata, not image archive
        run: |
          mkdir evidence
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request,json,hashlib,datetime
          url='https://api.figshare.com/v2/articles/20506506'
          req=urllib.request.Request(url,headers={'User-Agent':'Countback-Public-Evaluation/1'})
          with urllib.request.urlopen(req,timeout=30) as r:
              data=r.read(4*1024*1024+1)
          assert len(data)<=4*1024*1024
          a=json.loads(data)
          assert a['id']==20506506
          assert a['license']['url'].replace('http://','https://').rstrip('/')=='https://creativecommons.org/licenses/by/4.0'
          Path('evidence/publisher.json').write_bytes(data)
          out={'title':a['title'],'license':a['license'],'authors':a['authors'],'files':a['files'],'version':a.get('version'),'metadata_sha256':hashlib.sha256(data).hexdigest(),'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'photos_acquired':0,'aws_executed':False}
          Path('evidence/summary.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: countback-public-discovery
          path: evidence/
          retention-days: 14
          if-no-files-found: warn
