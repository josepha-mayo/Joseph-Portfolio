name: von-rag R27 evidence retention
on:
  push:
    branches: [amd-r19-citation-rag-20260928]
    paths:
      - .github/workflows/von-rag-r27-evidence.yml
      - delivery/von-rag-r19/tests/test_evidence_retention.py
permissions:
  contents: read
concurrency:
  group: von-rag-r27-evidence
  cancel-in-progress: false
jobs:
  verify:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    defaults:
      run:
        working-directory: delivery/von-rag-r19
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: delivery/von-rag-r19
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install pinned test dependencies only
        run: python -m pip install -r requirements-test.txt
      - name: Run complete contract and evidence-retention tests
        run: |
          set -euo pipefail
          mkdir -p evidence/r27
          python -m pytest -q tests --junitxml=evidence/r27/tests.xml | tee evidence/r27/tests.log
          python - <<'PY'
          import hashlib,json,platform,xml.etree.ElementTree as ET
          from pathlib import Path
          xml=ET.parse('evidence/r27/tests.xml').getroot()
          suites=list(xml) if xml.tag=='testsuites' else [xml]
          totals={k:sum(int(s.get(k,0)) for s in suites) for k in ['tests','failures','errors','skipped']}
          assert not totals['failures'] and not totals['errors']
          result={'schema':'von-rag-r27-evidence-retention-1','status':'passed','python':platform.python_version(),
            'tests':totals,'scope':'CPU parser, retrieval, validation and runtime contracts; not neural accuracy',
            'native_gpu_validation':False,'selected_image_changed':False,'submission_changed':False,
            'source_sha256':{str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(Path('von_rag').glob('*.py'))}}
          Path('evidence/r27/RECEIPT.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: von-rag-r27-evidence-retention
          path: delivery/von-rag-r19/evidence/r27/
          retention-days: 14
