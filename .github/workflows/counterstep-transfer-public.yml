name: Counterstep Transfer Path anonymous verification
on:
  push:
    branches: [counterstep-transfer-final-20260908]
    paths: [public/counterstep/v11/PATH_PUBLIC_URL]
permissions:
  contents: write
concurrency:
  group: counterstep-transfer-final-public
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/counterstep-transfer-final-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install anonymous browser and media decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 -m venv /tmp/counterstep-public
          /tmp/counterstep-public/bin/pip -q install playwright==1.55.0
          /tmp/counterstep-public/bin/python -m playwright install --with-deps chromium
      - name: Verify served source, actual browser workflows and demonstration
        run: /tmp/counterstep-public/bin/python public/counterstep/v11/tools/path_public_check.py
      - name: Preserve actual public-origin results only on this branch
        if: always()
        run: |
          git config user.name 'Counterstep Public Verification'
          git config user.email 'counterstep-build@users.noreply.github.com'
          git add public/counterstep/v11/evidence/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record actual anonymous Transfer Path verification'
          git push origin HEAD:counterstep-transfer-final-20260908
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counterstep-transfer-public-evidence
          path: public/counterstep/v11/evidence/
          retention-days: 14
