name: Counterstep Transfer Path public verification
on:
  push:
    branches: [counterstep-transfer-20260908]
    paths: [public/counterstep/TRANSFER_PUBLIC_URL]
permissions:
  contents: write
concurrency:
  group: counterstep-transfer-public
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/counterstep-transfer-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install anonymous browser and media decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 -m venv /tmp/counterstep-transfer-public
          /tmp/counterstep-transfer-public/bin/pip -q install playwright==1.55.0
          /tmp/counterstep-transfer-public/bin/python -m playwright install --with-deps chromium
      - name: Test actual public documents, original and new workflows, source and media
        run: /tmp/counterstep-transfer-public/bin/python public/counterstep/tools/path_public_check.py
      - name: Preserve actual public-origin results
        if: always()
        run: |
          git config user.name 'Counterstep Public Verification'
          git config user.email 'counterstep-build@users.noreply.github.com'
          git add public/counterstep/evidence/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record anonymous Transfer Path deployment verification'
          git push origin HEAD:counterstep-transfer-20260908
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counterstep-transfer-public-evidence
          path: public/counterstep/evidence/
          retention-days: 14
