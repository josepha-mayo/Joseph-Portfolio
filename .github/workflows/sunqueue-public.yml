name: SunQueue anonymous public check
on:
  push:
    branches: [sunqueue-entry-preview-20260907]
    paths: [public/sunqueue/PUBLIC_READY]
permissions:
  contents: write
concurrency:
  group: sunqueue-public-check
  cancel-in-progress: false
jobs:
  check:
    if: github.ref == 'refs/heads/sunqueue-entry-preview-20260907'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sunqueue-entry-preview-20260907
      - name: Install browser and decoding tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 -m venv /tmp/sunqueue-public
          /tmp/sunqueue-public/bin/pip -q install playwright==1.55.0
          /tmp/sunqueue-public/bin/python -m playwright install chromium
      - name: Check public files and actual application workflows
        working-directory: public/sunqueue
        run: /tmp/sunqueue-public/bin/python public_check.py
      - name: Preserve actual public verification
        if: always()
        run: |
          git config user.name 'SunQueue Build'
          git config user.email 'sunqueue-build@users.noreply.github.com'
          git add public/sunqueue/evidence
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record actual anonymous SunQueue public verification'
          git pull --rebase origin sunqueue-entry-preview-20260907
          git push origin HEAD:sunqueue-entry-preview-20260907
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sunqueue-public-evidence
          path: public/sunqueue/evidence/
          retention-days: 14
