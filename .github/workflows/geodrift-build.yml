name: GeoDrift release
on:
  push:
    branches: [geodrift-entry-preview-20260907]
    paths: [.github/workflows/geodrift-build.yml, public/geodrift/REBUILD]
permissions:
  contents: write
concurrency:
  group: geodrift-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/geodrift-entry-preview-20260907'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: geodrift-entry-preview-20260907
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source presence and remove obsolete transport-only chunks
        run: |
          test -f public/geodrift/geodrift.py
          test -f public/geodrift/tests/browser.py
          if [ -d public/geodrift/build-input ]; then git rm -r public/geodrift/build-input; fi
      - name: Install browser verification tools
        run: |
          python3 -m venv /tmp/geodrift
          /tmp/geodrift/bin/pip -q install playwright==1.55.0
          /tmp/geodrift/bin/python -m playwright install --with-deps chromium
      - name: Build and execute all tests
        working-directory: public/geodrift
        run: /tmp/geodrift/bin/python tools/release.py
      - name: Preserve source and actual execution evidence
        if: always()
        run: |
          git config user.name 'GeoDrift Build'
          git config user.email 'geodrift-build@users.noreply.github.com'
          git add public/geodrift
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish GeoDrift source and actual build results'
          git pull --rebase origin geodrift-entry-preview-20260907
          git push origin HEAD:geodrift-entry-preview-20260907
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geodrift-release
          path: |
            public/geodrift/
            !public/geodrift/**/__pycache__/
          retention-days: 14
