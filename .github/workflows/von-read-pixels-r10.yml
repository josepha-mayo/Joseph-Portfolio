name: von-read pixel preservation R10
on:
  push:
    branches: [von-read-pixels-r10-20260927]
    paths:
      - delivery/von-read-r4/von_read/views.py
      - tools/von-input-r8/**
      - tools/von-input-r10/**
      - .github/workflows/von-read-pixels-r10.yml
permissions:
  contents: read
concurrency:
  group: von-read-pixels-r10-20260927
  cancel-in-progress: false
jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Prepare pinned dependencies and original decoder
        run: |
          python -m pip install Pillow==12.3.0 pytest==9.1.1
          cp delivery/von-read-r4/von_read/views.py tools/von-input-r8/views.py
          python - <<'PY'
          import urllib.request,hashlib
          from pathlib import Path
          url='https://raw.githubusercontent.com/josepha-mayo/Joseph-Portfolio/3186e0ef79c27a298ed7505ed834b6a2be929c05/delivery/von-read-r4/von_read/views.py'
          with urllib.request.urlopen(url,timeout=20) as response: data=response.read(10000)
          assert hashlib.sha256(data).hexdigest()=='310d04d6ea3e02c9c89feafab610bd4c26162bc504899ed329a12c4723da39f0'
          Path('tools/von-input-r8/original_views.py').write_bytes(data)
          PY
      - name: Check pixel preservation and admission behavior
        run: python -m pytest -q tools/von-input-r8/test_views.py tools/von-input-r10/test_pixels.py --junitxml=CPU_TESTS.xml
      - name: Run independent image references
        run: |
          python tools/von-input-r10/independent/validate_final_policy.py --candidate delivery/von-read-r4/von_read/views.py --receipt FINAL_POLICY_RECEIPT.json
          python tools/von-input-r10/independent/validate_tiff_orientation.py --candidate delivery/von-read-r4/von_read/views.py --receipt TIFF_ORIENTATION_RECEIPT.json
      - name: Verify bounded 48 MP unsigned16 input
        run: python tools/von-input-r10/large_uint16_check.py --out LARGE_UINT16_RESULTS.json
      - name: Retain 48 MP RGB format coverage
        working-directory: tools/von-input-r8
        run: timeout 110s python large_image_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: von-read-r10-pixel-evidence
          retention-days: 14
          path: |
            CPU_TESTS.xml
            FINAL_POLICY_RECEIPT.json
            TIFF_ORIENTATION_RECEIPT.json
            LARGE_UINT16_RESULTS.json
            tools/von-input-r8/LARGE_IMAGE_RESULTS.json

