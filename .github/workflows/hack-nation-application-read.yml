name: Hack-Nation public application inspection
on:
  push:
    branches: [prep/hack-nation-20260913]
    paths: ['.github/workflows/hack-nation-application-read.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read the official site and public registration page only
        run: |
          mkdir -p public-application-evidence
          python3 - <<'PY'
          import hashlib,json,urllib.request,urllib.parse
          from html.parser import HTMLParser
          from pathlib import Path
          class ReadPublic(HTMLParser):
              def __init__(self):
                  super().__init__(); self.suppress=0; self.text=[]; self.links=[]; self.fields=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag in ('script','style'): self.suppress+=1
                  if tag=='a' and a.get('href'): self.links.append({'text_url':a['href']})
                  if tag in ('input','select','textarea','button'): self.fields.append({'tag':tag,**{k:v for k,v in a.items() if k in ('name','type','placeholder','aria-label','required')}})
              def handle_endtag(self,tag):
                  if tag in ('script','style'): self.suppress=max(0,self.suppress-1)
              def handle_data(self,text):
                  if not self.suppress and text.strip():self.text.append(text.strip())
          out=Path('public-application-evidence'); records=[]
          for name,url in [('hacknation','https://hack-nation.ai/hackathon'),('application','https://luma.com/z3za7zow')]:
              rec={'name':name,'requested_url':url,'submitted':False,'personal_data_sent':False}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; ApplicationReadOnly/1.0)'})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read(3_000_001);rec.update(http_status=r.status,final_url=r.url,bytes=len(raw))
                  if len(raw)>3_000_000:raise ValueError('Public page exceeds bounded read')
                  (out/f'{name}.html').write_bytes(raw)
                  parser=ReadPublic();parser.feed(raw.decode('utf-8'))
                  (out/f'{name}.txt').write_text('\n'.join(parser.text))
                  (out/f'{name}-elements.json').write_text(json.dumps({'links':parser.links,'fields':parser.fields},indent=2))
                  rec.update(status='read',sha256=hashlib.sha256(raw).hexdigest())
              except Exception as e:rec.update(status='failed',error_type=type(e).__name__)
              records.append(rec)
          (out/'readback.json').write_text(json.dumps(records,indent=2));print(json.dumps(records,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hack-nation-public-application-read
          path: public-application-evidence/
          retention-days: 7
