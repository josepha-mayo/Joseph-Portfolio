name: von-read R6 full candidate staging
# Stage only. The failed two-export run stays preserved; no public full download is enabled.
on:
  push:
    branches: [von-registry-r5-20260925]
    paths: [.github/workflows/von-registry-r6-stage.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: von-registry-full-stage
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BASE_IMAGE: rocm/pytorch:rocm10.0_ubuntu26.04_py3.14_pytorch_release_2.13.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3186e0ef79c27a298ed7505ed834b6a2be929c05
          persist-credentials: false
          path: candidate_source
          sparse-checkout: delivery/von-read-r4
      - uses: actions/checkout@v4
        with:
          ref: 15a5dad40811365ba051bd26ba0cc28f5fec4137
          persist-credentials: false
          path: publisher_source
          sparse-checkout: delivery/registry-r5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::046675437218:role/von-registry-r5-publisher-20260925
          role-session-name: von-candidate-single-export
          role-duration-seconds: 3600
          mask-aws-account-id: true
          unset-current-credentials: true
      - name: Prepare disposable builder and test the export correction
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          mkdir receipts
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet
          python3 - <<'PY'
          import hashlib,json,pathlib,shutil
          root=pathlib.Path('candidate_source/delivery/von-read-r4')
          assert shutil.disk_usage('/').free>80*2**30
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          pathlib.Path('receipts/SOURCE.json').write_text(json.dumps({'application_commit':'3186e0ef79c27a298ed7505ed834b6a2be929c05','files':files},indent=2))
          PY
          python3 -m venv /tmp/von-publisher-env
          /tmp/von-publisher-env/bin/pip -q install boto3 requests pytest
          (cd publisher_source && git apply --check delivery/registry-r5/single-export.patch && git apply delivery/registry-r5/single-export.patch)
          (cd publisher_source/delivery/registry-r5 && /tmp/von-publisher-env/bin/python -m pytest -q test_export_plan.py --junitxml="$GITHUB_WORKSPACE/receipts/EXPORT_TESTS.xml")
          sha256sum publisher_source/delivery/registry-r5/publish_candidate.py > receipts/PUBLISHER_SOURCE_SHA256.txt
      - name: Pull mandatory base and build the weighted candidate
        timeout-minutes: 18
        run: |
          set -euo pipefail
          timeout --kill-after=15s 600s docker pull "$BASE_IMAGE" > receipts/base-pull.log 2>&1
          timeout --kill-after=10s 600s python3 -u candidate_source/delivery/von-read-r4/packaging/fetch_model.py --lock candidate_source/delivery/von-read-r4/packaging/MODEL_LOCK.json --destination candidate_source/delivery/von-read-r4/models/reader > receipts/model.log 2>&1
          timeout --kill-after=15s 600s docker build --progress=plain -f candidate_source/delivery/von-read-r4/packaging/Dockerfile.worker -t von-read-candidate:local candidate_source/delivery/von-read-r4 > receipts/build.log 2>&1
      - name: Check actual container before publishing bytes
        run: |
          timeout --kill-after=5s 120s docker run --rm --network none --entrypoint python3 -v "$PWD/candidate_source/delivery/von-read-r4/packaging/container_checks.py:/checks.py:ro" -v "$PWD/receipts:/reports" von-read-candidate:local /checks.py --out /reports/CLI.json > receipts/cli.log 2>&1
          python3 - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path('receipts/CLI.json').read_text())
          assert r['status']=='passed' and len(r['calls'])==10 and all(r['checks'].values()) and not r['gpu_inference']
          PY
      - name: Stage candidate with one export and original base blobs
        timeout-minutes: 20
        run: |
          set -euo pipefail
          /tmp/von-publisher-env/bin/python -u publisher_source/delivery/registry-r5/publish_candidate.py
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('receipts/S3_PUBLICATION.json');r=json.loads(p.read_text())
          r['status']='complete_image_staged_full_public_pull_pending'
          r['anonymous_full_pull_verified']=False
          r['official_submission']=False
          r['prior_failed_staging_run']=36190035105
          r['availability']='Temporary bounded test registry; not a stable grader image reference.'
          p.write_text(json.dumps(r,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: von-r6-staged-candidate-receipts
          path: receipts/
          retention-days: 7
          if-no-files-found: error
