name: Countback public photographic data
on:
  push:
    branches: [data/countback-public-photos-20260913]
    paths: ['countback-acquisition/**', '.github/workflows/countback-public-photos.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: countback-public-photos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  acquire:
    if: github.ref == 'refs/heads/data/countback-public-photos-20260913'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify unchanged acquisition source and discover actual publisher
        run: |
          mkdir -p photo-evidence
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          source=Path('countback-acquisition/acquire.py')
          actual=hashlib.sha256(source.read_bytes()).hexdigest()
          assert actual=='52ebdbcb7c2ebeb895316c44176750674e66a390feaa311a4136c23af94867e1', actual
          r=subprocess.run(['python3', str(source), 'discover', '--article', '20506506', '--out', 'photo-evidence/discovery'], capture_output=True, text=True, timeout=90)
          Path('photo-evidence/discovery.stdout').write_text(r.stdout)
          Path('photo-evidence/discovery.stderr').write_text(r.stderr)
          print(r.stdout)
          if r.returncode: raise SystemExit(r.returncode)
          data=json.loads(Path('photo-evidence/discovery/publisher.json').read_text())
          print(json.dumps({'title':data.get('title'),'license':data.get('license'),'files':[{'id':f['id'],'name':f['name'],'size':f['size']} for f in data['files']]},indent=2))
          zips=sorted([f for f in data['files'] if f['name'].lower().endswith('.zip')],key=lambda f:(f['size'],f['id']))
          if not zips: raise SystemExit('Publisher release has no supported ZIP')
          chosen=zips[0]
          Path('photo-evidence/chosen-archive.json').write_text(json.dumps(chosen,indent=2))
          r=subprocess.run(['python3',str(source),'catalog','--article','20506506','--file-id',str(chosen['id']),'--out','photo-evidence/catalog'],capture_output=True,text=True,timeout=180)
          Path('photo-evidence/catalog.stdout').write_text(r.stdout)
          Path('photo-evidence/catalog.stderr').write_text(r.stderr)
          print(r.stdout)
          if r.returncode: raise SystemExit(r.returncode)
          cat=json.loads(Path('photo-evidence/catalog/acquisition.json').read_text())
          print(json.dumps({'archive':cat['archive'],'count':len(cat['members']),'first_members':cat['members'][:60]},indent=2))
          PY
      - name: Save observed evidence without predictions or cloud deployment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: countback-public-photo-discovery
          path: photo-evidence/
          retention-days: 14
          if-no-files-found: error
