name: von-rag R32 original-weight CPU diagnosis
on:
  push:
    branches: [amd-r19-citation-rag-20260928]
    paths: [.github/workflows/von-rag-r32-fp32.yml]
permissions:
  contents: read
concurrency:
  group: von-rag-r32-fp32
  cancel-in-progress: false
jobs:
  official-sample:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: delivery/von-rag-r19
    env:
      OMP_NUM_THREADS: '4'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: delivery/von-rag-r19
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned CPU diagnostic dependencies
        run: |
          set -euo pipefail
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==5.3.0 accelerate==1.13.0 Pillow==12.3.0 PyMuPDF==1.26.7
      - name: Exact arithmetic checks, actual vision, all ten official sample questions
        timeout-minutes: 22
        run: |
          set -euo pipefail
          mkdir -p evidence/r32/fp32-arithmetic-r24
          timeout --kill-after=10s 1260s python -u diagnostics/official_cpu_fp32.py --work evidence/r32 2>&1 | tee evidence/r32/fp32-arithmetic-r24/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: von-rag-r32-fp32-official-sample
          path: |
            delivery/von-rag-r19/evidence/r32/fp32-arithmetic-r24/*.json
            delivery/von-rag-r19/evidence/r32/fp32-arithmetic-r24/*.log
          retention-days: 14
