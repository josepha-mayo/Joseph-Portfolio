name: Countback public ZIP directory
on:
  push:
    branches: [eval/countback-uwis-discovery]
    paths: [.github/workflows/countback-public-catalog.yml]
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read bounded ZIP directory, no image extraction
        run: |
          mkdir evidence
          python3 - <<'PY'
          import urllib.request,struct,json,hashlib,time
          from pathlib import Path
          url='https://ndownloader.figshare.com/files/36708684'
          size=13204345179
          def read_range(start,end):
              assert 0<=start<=end<size and end-start<16*1024*1024
              req=urllib.request.Request(url,headers={'Range':f'bytes={start}-{end}','Accept-Encoding':'identity','User-Agent':'Countback-Evaluation/1'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  assert r.status==206,'Full archive download refused'
                  assert r.headers['Content-Range']==f'bytes {start}-{end}/{size}'
                  data=r.read(end-start+2)
                  assert len(data)==end-start+1
                  etag=r.headers.get('ETag')
              time.sleep(1)
              return data,etag
          tail,etag=read_range(size-131072,size-1)
          i=tail.rfind(b'PK\x05\x06');assert i>=0
          v=struct.unpack_from('<4s4H2IH',tail,i);cdsize,offset=v[5:7]
          if cdsize==0xffffffff or offset==0xffffffff:
              loc=tail.rfind(b'PK\x06\x07');assert loc>=0
              zoff=struct.unpack_from('<4sIQI',tail,loc)[2]
              record=tail[zoff-(size-len(tail)):]
              if len(record)<56:record,_=read_range(zoff,zoff+55)
              zz=struct.unpack_from('<4sQ2H2I4Q',record);cdsize,offset=zz[-2:]
          cd,etag2=read_range(offset,offset+cdsize-1);assert etag2==etag
          rows=[];p=0
          while p<len(cd):
              x=struct.unpack_from('<4s6H3I5H2I',cd,p);assert x[0]==b'PK\x01\x02'
              nl,el,cl=x[10:13];name=cd[p+46:p+46+nl].decode('utf8')
              rows.append({'name':name,'bytes':x[9],'compressed_bytes':x[8],'method':x[4],'local_offset':x[-1],'extra_hex':cd[p+46+nl:p+46+nl+el].hex()})
              p+=46+nl+el+cl
          Path('evidence/catalog.json').write_text(json.dumps({'file_id':36708684,'archive_bytes':size,'etag':etag,'directory_sha256':hashlib.sha256(cd).hexdigest(),'directory_bytes':cdsize,'members':rows},indent=2))
          print(json.dumps({'entries':len(rows),'directory_bytes':cdsize,'first_entries':rows[:25]},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: countback-public-catalog
          path: evidence/
          retention-days: 14
          if-no-files-found: warn
