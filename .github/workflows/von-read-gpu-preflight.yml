name: von-read GPU acceptance preflight
on:
  push:
    paths:
      - delivery/von-read-acceptance/**
      - .github/workflows/von-read-gpu-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install CPU preflight test dependencies
        run: python -m pip install pillow==12.3.0 pytest==9.0.2
      - name: Check source identity, input isolation and GPU refusal
        env:
          VON_ACCEPTANCE_SOURCE: ${{ github.workspace }}/delivery/von-read-r4
        run: |
          python -m pytest -q delivery/von-read-acceptance/tests --junitxml=acceptance-preflight.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: von-read-gpu-acceptance-preflight
          path: acceptance-preflight.xml
          retention-days: 14
          if-no-files-found: error
