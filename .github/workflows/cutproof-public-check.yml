name: CutProof public deployment check
on:
  push:
    branches: [cutproof-entry-preview-20260906]
    paths: [public/cutproof/CHECK_PUBLIC_READY]
permissions:
  contents: write
concurrency:
  group: cutproof-public-check
  cancel-in-progress: false
jobs:
  public-check:
    if: github.ref == 'refs/heads/cutproof-entry-preview-20260906'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cutproof-entry-preview-20260906
      - name: Prepare browser and decoding tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg python3-venv
          python3 -m venv /tmp/cutproof-public-venv
          /tmp/cutproof-public-venv/bin/python -m pip install playwright
          /tmp/cutproof-public-venv/bin/python -m playwright install --with-deps chromium
      - name: Exercise the anonymous public site
        working-directory: public/cutproof
        run: |
          URL=$(head -n 1 CHECK_PUBLIC_READY)
          /tmp/cutproof-public-venv/bin/python scripts/public_check.py --base-url "$URL"
      - name: Preserve actual public-check evidence
        if: always()
        run: |
          git config user.name 'CutProof Build'
          git config user.email 'cutproof-build@users.noreply.github.com'
          git add public/cutproof/evidence
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record anonymous public deployment verification and screenshots'
          git push origin HEAD:cutproof-entry-preview-20260906
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cutproof-public-evidence
          path: |
            public/cutproof/evidence/public-*
          retention-days: 7
