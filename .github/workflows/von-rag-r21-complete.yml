name: von-rag R21 verified repair and real-model rerun
on:
  push:
    branches: [amd-r19-citation-rag-20260928]
    paths: [.github/workflows/von-rag-r21-complete.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: von-rag-r21-repair
  cancel-in-progress: false
jobs:
  regression:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: delivery/von-rag-r19
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: delivery/von-rag-r19
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-test.txt
      - name: Test the repaired pipeline and fresh authored corpus
        run: |
          set -euo pipefail
          mkdir -p evidence/r21
          python -m pytest -q --junitxml=evidence/r21/tests.xml | tee evidence/r21/tests.log
          python benchmark.py --out evidence/r21/benchmark --seed 853791 --products 32
          python -m pip freeze > evidence/r21/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: von-rag-r21-regression
          path: delivery/von-rag-r19/evidence/r21/
          retention-days: 7
  pretrained-rerun:
    needs: regression
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: delivery/von-rag-r19
    env:
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: delivery/von-rag-r19
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install explicit CPU-only diagnostic stack
        run: |
          set -euo pipefail
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==5.3.0 accelerate==1.13.0 Pillow==12.3.0
      - name: Rerun the exact prior neural cases after the repair
        timeout-minutes: 16
        run: |
          set -euo pipefail
          mkdir -p evidence/r20-model
          python -m pip freeze > evidence/r20-model/environment.txt
          timeout --kill-after=10s 900s python -u diagnostics/model_probe.py 2>&1 | tee evidence/r20-model/run.log
      - name: Compare against the actual previous neural results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('evidence/r20-model')
          r=json.loads((p/'RECEIPT.json').read_text())
          results=json.loads((p/'results.json').read_text())
          expected={'current':('87',['current.txt']),'bridge':('3.8.6',['events.log','fixes.csv']),'unknown':('',[])}
          matched={x['id']:x.get('exact_answer_and_citations',False) for x in results}
          report={'status':'completed','baseline_run':36465145846,'baseline_correct':2,'candidate_correct':r['correct'],'total':3,
                  'candidate_cases':matched,'fresh_pretrained_inference':True,'same_authored_diagnostics':True,
                  'new_generalization_claim':False,'amd_qualification':False,'production_30_second_gate_validated':False,
                  'candidate_commit':__import__('os').environ['GITHUB_SHA']}
          (p/'R21_COMPARISON.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: von-rag-r21-pretrained-rerun
          path: |
            delivery/von-rag-r19/evidence/r20-model/*.json
            delivery/von-rag-r19/evidence/r20-model/*.txt
            delivery/von-rag-r19/evidence/r20-model/*.log
          retention-days: 7
