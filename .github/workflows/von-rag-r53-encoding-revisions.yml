name: von-rag R53 encoding and revision semantics
on:
  push:
    branches: [amd-r53-encoding-revisions-20260930]
    paths:
      - delivery/von-rag-r19/**
      - .github/workflows/von-rag-r53-encoding-revisions.yml
permissions:
  contents: read
concurrency:
  group: von-r53-${{ github.ref }}
  cancel-in-progress: false
jobs:
  software:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    defaults:
      run:
        working-directory: delivery/von-rag-r19
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-test.txt
      - run: python -m compileall -q von_rag
      - name: Full software suite
        run: |
          set -euo pipefail
          mkdir -p evidence/r53
          python -m pytest -q tests -p no:cacheprovider --junitxml=evidence/r53/ci-tests.xml | tee evidence/r53/ci-tests.log
          python - <<'PY'
          import hashlib,importlib.metadata,json,os,sys,xml.etree.ElementTree as ET
          from pathlib import Path
          root=ET.parse('evidence/r53/ci-tests.xml').getroot()
          suites=list(root) if root.tag=='testsuites' else [root]
          totals={k:sum(int(s.get(k,0)) for s in suites) for k in ['tests','failures','errors','skipped']}
          assert totals=={'tests':296,'failures':0,'errors':0,'skipped':0},totals
          out={'schema':'von-rag-r53-ci-software-1','commit':os.environ['GITHUB_SHA'],
               'python':sys.version,'tests':totals,
               'packages':{p:importlib.metadata.version(p) for p in ['pytest','PyMuPDF','python-docx','openpyxl','Pillow']},
               'source_sha256':{str(p):hashlib.sha256(p.read_bytes()).hexdigest()
                                for p in [Path('von_rag/parsers.py'),Path('von_rag/retrieval.py'),Path('tests/test_r53_encoding_revision.py')]},
               'fresh_model_calls':0,'native_amd_validation':False,'submission_changed':False}
          Path('evidence/r53/CI_RECEIPT.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: von-rag-r53-software-python-${{ matrix.python }}
          path: delivery/von-rag-r19/evidence/r53/
          retention-days: 14
