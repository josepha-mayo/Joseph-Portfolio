name: CutProof native quickstart verification
on:
  push:
    branches: [cutproof-launch-20260909]
    paths: [.github/workflows/cutproof-quickstart.yml, QUICKSTART_REBUILD]
permissions:
  contents: write
concurrency:
  group: cutproof-quickstart
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/cutproof-launch-20260909'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real browser and media verification dependencies
        run: |
          sudo apt-get update -qq -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng
          if ! command -v google-chrome >/dev/null; then
            curl -fsSL --retry 2 https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -o /tmp/chrome.deb
            sudo apt-get install -y /tmp/chrome.deb
          fi
          python -m pip install playwright==1.55.0
          python -m playwright install ffmpeg
      - name: Preserve old generated test render before running the unchanged non-overwriting renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,shutil
          old=Path('public/cutproof/v15/evidence/passage-render')
          if old.exists():
              dest=Path('upgrade16/verification/prior-render')/os.environ['GITHUB_RUN_ID']
              assert not dest.exists()
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.move(str(old),str(dest))
          PY
      - name: Run existing assertions and actual quickstart workflow without weakening CSP
        run: python upgrade16/release.py
      - name: Preserve isolated implementation and actual outcomes
        if: always()
        run: |
          git config user.name 'CutProof Quickstart Verification'
          git config user.email 'cutproof-build@users.noreply.github.com'
          git add upgrade16/ public/cutproof/v15/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record native quickstart release outcomes and standalone source'
          git push origin HEAD:cutproof-launch-20260909
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cutproof-quickstart-verified
          path: |
            upgrade16/
            public/cutproof/v15/
          retention-days: 14
